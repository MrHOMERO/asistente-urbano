<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Asistente Urbano Personalizable</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-viewport">
    
    <!-- ENCABEZADO Y ESTADO DE VOZ -->
    <header class="app-header">
      <h1>Asistente Personal</h1>
      <div class="voice-status-bar">
        <span id="voice-dot" class="dot listening-bg"></span>
        <p id="assistant-status">Di "encender micrófono" para comenzar...</p>
      </div>
    </header>

    <!-- ACCIÓN RÁPIDA: CREAR NUEVA TARJETA -->
    <div class="top-bar">
      <button id="btn-open-modal" class="btn-create">+ Crear Nueva Acción</button>
    </div>

    <!-- CONTENEDOR DINÁMICO DE TARJETAS -->
    <main id="cards-container" class="dashboard">
      <!-- Se cargan dinámicamente aquí -->
    </main>

    <!-- INDICADOR DE MICRÓFONO FLOTANTE (ESTADO) -->
    <div class="hands-free-indicator">
      <div id="mic-pulse-ring" class="pulse-ring"></div>
      <span class="mic-badge">🎙️ Escucha Continua</span>
    </div>

  </div>

  <!-- MODAL PARA CREAR NUEVA ACCIÓN -->
  <div id="modal-create" class="modal hidden">
    <div class="modal-content">
      <h2>Crear Nueva Acción</h2>
      <form id="form-create-card">
        
        <label>Selecciona un Ícono</label>
        <div class="emoji-picker">
          <button type="button" class="emoji-btn active" data-emoji="⚡">⚡</button>
          <button type="button" class="emoji-btn" data-emoji="🏍️">🏍️</button>
          <button type="button" class="emoji-btn" data-emoji="🐶">🐶</button>
          <button type="button" class="emoji-btn" data-emoji="💊">💊</button>
          <button type="button" class="emoji-btn" data-emoji="🏠">🏠</button>
          <button type="button" class="emoji-btn" data-emoji="📄">📄</button>
        </div>

        <div class="input-group">
          <label>Título de la Acción</label>
          <input type="text" id="card-title" required placeholder="Ej. Service de la Moto / Vacuna Firulais">
        </div>

        <div class="input-group">
          <label>Información / Detalle o Fecha</label>
          <textarea id="card-info" rows="2" required placeholder="Ej. Próximo cambio de aceite a los 15.000 km"></textarea>
        </div>

        <div class="input-group">
          <label>Foto o Documento Adjunto (Opcional)</label>
          <input type="file" id="card-file" accept="image/*,application/pdf">
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-close-modal" class="btn-secondary">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar Acción</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
